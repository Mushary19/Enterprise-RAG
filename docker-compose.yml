version: "3.8"

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: enterprise_postgres
    restart: always
    env_file:
      - .env.local
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network

  chroma_vector_db:
    image: chromadb/chroma:0.5.23
    container_name: enterprise_chroma
    restart: always
    ports:
      - "8010:8000"
    volumes:
      - chroma_data:/chroma/data
    env_file:
      - .env.local
    # environment:
    #   - IS_PERSISTENT=TRUE
    #   - PERSISTIST_DIRECTORY=/chroma/data
    networks:
      - rag_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: always
    ports:
      - "8080:8000"
    environment:
      - CHROMA_SERVER_HOST=${CHROMA_SERVER_HOST}
      - CHROMA_SERVER_HTTP_PORT=${CHROMA_SERVER_HTTP_PORT}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres_db
      - chroma_vector_db
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rag_network

volumes:
  postgres_data:
  chroma_data:

networks:
  rag_network:
    driver: bridge
